name: build-anitomy-matrix

on:
  push:
    branches: [ anitomy ]
  workflow_dispatch: 

env:
  OUTDIR: prebuilt

jobs:
  build-linux:
    name: Build Linux (matrix)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [ amd64, arm64, arm ]    # amd64, aarch64, armv7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Free Disk-Space
        run: df -h && sudo apt-get clean && docker system prune -a -f && sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/local/lib/android && df -h

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget git lld cmake ninja-build build-essential \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          
  

      - name: Print tool versions
        run: |
          clang-21 --version || true
          lld --version || true
          cmake --version

      - name: Prepare output dir
        run: |
          OUT=${GITHUB_WORKSPACE}/${{ env.OUTDIR }}/linux_${{ matrix.arch }}
          mkdir -p "$OUT"
    
      - name: Clone anitomy
        run : |
          sudo mkdir /me && sudo chmod -R 777 /me
          cd /me
          git clone https://github.com/YUKI2eN3e/anitomy .
          

      - name: Configure & build (native or cross)
        run: |
          cd /me
          set -eux
          OUT=${GITHUB_WORKSPACE}/${{ env.OUTDIR }}/linux_${{ matrix.arch }}
          BUILD_DIR=build_linux_${{ matrix.arch }}
          mkdir -p "$BUILD_DIR"
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            CXX=clang++-21
            cmake -S . -B "$BUILD_DIR" \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_CXX_COMPILER=${CXX} \
              -DCMAKE_CXX_STANDARD=23 \
              -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY=${OUT}
            cmake --build "$BUILD_DIR" --parallel
          else
            # Cross-compile attempt for arm64/arm using cross gcc toolchains installed above.
            # You may want to replace this with clang --target=... + proper sysroot if you prefer.
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              TRIPLET="aarch64-linux-gnu"
            else
              TRIPLET="arm-linux-gnueabihf"
            fi
            
            # Set common Clang variables
            export CXX="clang++-21 --target=$TRIPLET"

            cmake -S . -B "$BUILD_DIR" \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_CXX_COMPILER=clang++-21 \
              -DCMAKE_CXX_STANDARD=23 \
              -DCMAKE_CXX_COMPILER_TARGET=${TRIPLET} \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }} \
              -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY=${OUT}
            cmake --build "$BUILD_DIR" --parallel
          fi

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: anitomy-linux-${{ matrix.arch }}
          path: prebuilt/linux_${{ matrix.arch }}/

  build-windows:
    name: Build Windows (matrix)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        arch: [ amd64, 386, arm64 ]            # windows x64, x86, arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup MSYS2 (for mingw / unix tools)
        uses: msys2/setup-msys2@v1
        with:
          msystem: MINGW64
          update: true
          install: git

      - name: Choose LLVM tarball by arch
        id: choose
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            TARURL="https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0-rc1/clang+llvm-22.1.0-rc1-aarch64-pc-windows-msvc.tar.xz"
          else
            # for amd64 and 386 use x86_64 binary tarball
            TARURL="https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0-rc1/clang+llvm-22.1.0-rc1-x86_64-pc-windows-msvc.tar.xz"
          fi
          echo "TARURL=${TARURL}" >> $GITHUB_ENV
          echo "Selected TAR: $TARURL"

      - name: Download LLVM 22 tarball
        run: |
          cd $GITHUB_WORKSPACE
          curl -L -o llvm.tar.xz "${TARURL}"

      - name: Unpack LLVM into MSYS2 root
        run: |
          :: Note: msys2 root is usually C:\msys64 for windows-latest
          powershell -Command " \
            $msys = 'C:\\msys64'; \
            Write-Host \"MSYS root: $msys\"; \
            mkdir -Force $msys\\usr\\local; \
            tar -xJf llvm.tar.xz -C $msys\\usr\\local --strip-components=1; \
            Write-Host 'Extracted LLVM into' $msys\\usr\\local; \
            "
      - name: Verify clang
        shell: bash
        run: |
          echo "PATH before: $PATH"
          export PATH="/c/msys64/usr/local/bin:${PATH}"
          which clang || true
          clang --version

      - name: Prepare output dir
        run: |
          mkdir -p prebuilt/windows_${{ matrix.arch }}

      - name: Clone anitomy
        run : |
          mkdir /c/me
          cd /c/me
          git clone https://github.com/erengy/anitomy .

      - name: Configure & build with Clang on Windows
        shell: bash
        env:
          PATH: /c/msys64/usr/local/bin:/c/msys64/usr/bin:${PATH}
        run: |
          cd /c/me
          set -eux
          OUT=${GITHUB_WORKSPACE}/prebuilt/windows_${{ matrix.arch }}
          BUILD_DIR=build_windows_${{ matrix.arch }}
          mkdir -p "$BUILD_DIR"
          # Use Ninja + clang from unpacked LLVM
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_COMPILER=/c/msys64/usr/local/bin/clang \
            -DCMAKE_CXX_COMPILER=/c/msys64/usr/local/bin/clang++ \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY=${OUT}
          cmake --build "$BUILD_DIR" --parallel

          # Create .a with llvm-ar if present (prefer .a for cgo portability)
          if [ -f /c/msys64/usr/local/bin/llvm-ar ]; then
            /c/msys64/usr/local/bin/llvm-ar rcs ${OUT}/libanitomy.a ${BUILD_DIR}/*.o || true
          fi

      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: anitomy-windows-${{ matrix.arch }}
          path: prebuilt/windows_${{ matrix.arch }}/
