name: Build Anitomy - Alpine Multi-Arch

on:
  push:
    branches: [ anitomy ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: armv7
            runner_arch: linux/arm/v7
            artifact_name: anitomy-arm32
          - arch: aarch64
            runner_arch: linux/arm64/v8
            artifact_name: anitomy-arm64
          - arch: x86_64
            runner_arch: linux/amd64
            artifact_name: anitomy-amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build for ${{ matrix.arch }}
        uses: uraimo/run-on-arch-action@v3
        id: build
        with:
          arch: none
          distro: none
          base_image: --platform=${{ matrix.runner_arch }} alpine:latest
          githubToken: ${{ github.token }}
          setup: |
            mkdir -p "${{ github.workspace }}/artifacts"
          dockerRunArgs: |
            --volume "${{ github.workspace }}/artifacts:/artifacts"
          env: |
            ARTIFACT_NAME: ${{ matrix.artifact_name }}
          shell: /bin/sh
          # Alpine package installation
          install: |
            #apk update
            #apk add --no-cache git cmake build-base gcc musl-dev
          # Build commands
          run: |
            apk update
            apk add --no-cache git cmake build-base gcc musl-dev
            set -e
            echo "Building for ${{ matrix.arch }}..."
            
            # Clone repository
            git clone https://github.com/YUKI2eN3e/anitomy.git /anitomy
            cd /anitomy
            
            # Create build directory
            BUILD_DIR="/anitomy/build"
            mkdir -p "$BUILD_DIR"
            cd "$BUILD_DIR"
            
            # Configure with static linking
            cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_CXX_COMPILER=g++ \
              -DCMAKE_CXX_STANDARD=23 \
              -DCMAKE_EXE_LINKER_FLAGS="-static -no-pie -static-libgcc -static-libstdc++"
            
            # Build
            cmake --build . --parallel
            
            # Copy executable from bin directory
            if [ -f "/anitomy/bin/anitomy" ]; then
              cp "/anitomy/bin/anitomy" "/artifacts/${ARTIFACT_NAME}"
              echo "Build successful! Executable copied from /anitomy/bin/anitomy"
              
              # Verify static linking
              file "/artifacts/${ARTIFACT_NAME}"
            else
              echo "ERROR: Executable not found in /anitomy/bin/anitomy"
              find /anitomy -name "anitomy" -type f
              exit 1
            fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.artifact_name }}

  build_win:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      matrix:
        include:
          - arch: x64
            msystem: UCRT64
            pkg_prefix: mingw-w64-ucrt-x86_64
            cc: x86_64-w64-mingw32-g++
            artifact_name: anitomy-x64.exe
          - arch: x86
            msystem: MINGW32
            pkg_prefix: mingw-w64-i686
            cc: i686-w64-mingw32-g++
            artifact_name: anitomy-x86.exe

    steps:
      - name: Setup MSYS2 and install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: |
            ${{ matrix.pkg_prefix }}-cmake
            ${{ matrix.pkg_prefix }}-gcc
            ${{ matrix.pkg_prefix }}-toolchain
            git
            unzip
            wget
      - name: Clone Repository
        run:  git clone https://github.com/YUKI2eN3e/anitomy.git anitomy
      - name: Build anitomy
        run: |
            cd anitomy
            
            # Create build directory
            BUILD_DIR="build"
            mkdir -p "$BUILD_DIR"
            cd "$BUILD_DIR"
            
            # Configure with static linking
            cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_CXX_COMPILER=${{ matrix.cc }} \
              -DCMAKE_CXX_STANDARD=23 \
              -DCMAKE_EXE_LINKER_FLAGS="-static -no-pie -static-libgcc -static-libstdc++"
            
            # Build
            cmake --build . --parallel
            
            # Copy executable from bin directory
            if [ -f "anitomy/bin/anitomy" ]; then
              cp "anitomy/bin/anitomy" "anitomy/${ARTIFACT_NAME}"            
              echo "Build successful!"
              
              # Verify static linking
              file "anitomy/${ARTIFACT_NAME}"
            else
              echo "ERROR: Executable not found in anitomy/bin/anitomy"
              find . -name "anitomy" -type f
              exit 1
            fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: anitomy/${{ matrix.artifact_name }}


  release:
    runs-on: ubuntu-latest
    needs: [ build, build_win ]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloads
          merge-multiple: true

      - name: Show downloaded files
        run: |
          ls -lah ./downloads
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: downloads/anitomy-*
          tag_name: anitomy
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
