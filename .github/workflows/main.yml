name: Build TDLight Bot API

on:
  push:
    branches: [ tg-bot-api ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Set up QEMU (for arm64)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Build static binary inside Alpine container
        run: |
          docker run --rm \
            -v /tmp/tdlight-build:/workspace \
            -w /workspace \
            --platform linux/${{ matrix.arch }} \
            alpine:latest /bin/sh -c '
            apk add --no-cache alpine-sdk cmake git gperf \
              openssl-dev openssl-libs-static \
              zlib-dev zlib-static \
              linux-headers
            git clone --recursive https://github.com/tdlight-team/tdlight-telegram-bot-api.git src
            cd src
            mkdir build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_EXE_LINKER_FLAGS="-static -s" \
                  -DOPENSSL_USE_STATIC_LIBS=ON \
                  -DZLIB_USE_STATIC_LIBS=ON \
                  -DTD_ENABLE_LTO=ON \
                  ..
            cmake --build . --target install -j$(nproc)
            cp /usr/local/bin/telegram-bot-api /workspace/telegram-bot-api-${{ matrix.arch }}
            '

      - name: Check executable
        run: |
          ldd /tmp/tdlight-build/telegram-bot-api-${{ matrix.arch }} || true
          file /tmp/tdlight-build/telegram-bot-api-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlight-botapi-static-${{ matrix.arch }}
          path: /tmp/tdlight-build/telegram-bot-api-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Create or update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tg-bot-api-latest
          name: "TDLight Bot API (latest)"
          body: "Static builds for amd64 and arm64. Updated on every push to `tg-bot-api`."
          prerelease: false
          make_latest: true
          files: dist/*
