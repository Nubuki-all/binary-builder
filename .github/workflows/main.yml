name: Build TDLight Bot API

on:
  push:
    branches: [ tg-bot-api ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Set up QEMU (for arm64)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Build static binary inside Alpine container
        run: |
          docker run --rm \
            -v /tmp/tdlight-build:/workspace \
            -w /workspace \
            --platform linux/${{ matrix.arch }} \
            alpine:latest /bin/sh -c '
            apk add --no-cache alpine-sdk cmake git gperf \
              openssl-dev openssl-libs-static \
              zlib-dev zlib-static \
              linux-headers
            git clone --recursive https://github.com/tdlight-team/tdlight-telegram-bot-api.git src
            cd src
            mkdir build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_EXE_LINKER_FLAGS="-static" \
                  -DOPENSSL_USE_STATIC_LIBS=ON \
                  -DZLIB_USE_STATIC_LIBS=ON \
                  -DTD_ENABLE_LTO=ON \
                  ..
            cmake --build . --target install -j$(nproc)
            cp /workspace/src/bin/telegram-bot-api /workspace/telegram-bot-api
            '
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlight-botapi-static-${{ matrix.arch }}
          path: /tmp/tdlight-build/telegram-bot-api
