name: Build Windows Release with MSYS2

on:
  push:
    branches: [ libshout-win ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  ARTIFACT_NAME: libshout.zip

jobs:
  build-and-release:
    runs-on: windows-latest # Runs on a Windows runner
    defaults:
      run:
        shell: msys2 {0} # All `run` steps will execute in the MSYS2 shell

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2 and install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: |
            pkg-config
            mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-libogg
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-libtheora
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-speex
            mingw-w64-ucrt-x86_64-libwinpthread
            zip
            git
            mingw-w64-ucrt-x86_64-github-cli

      - name: Build libshout 
        run: |
          mkdir libshout
          export OUTDIR=$PWD/libshout
          git clone --recursive https://gitlab.xiph.org/xiph/icecast-libshout libshout-build && cd libshout-build 
          git submodule update --remote src/common
          ./autogen.sh
          CFLAGS='-DDISABLE_IPV6' ./configure --prefix=$OUTDIR --host=x86_64-w64-mingw32 --enable-shared --enable-static
          make -j$(nproc)
          make install
          cd "$OUTDIR"
          zip -r ../$ARTIFACT_NAME .
          ls -ash
          echo "CURRENT_TIME=$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_ENV

      - name: Upload timestamped release artifact
        uses: ncipollo/release-action@v1
        with:
          tag: libshout-win-${{ env.CURRENT_TIME }}
          artifacts: ${{ env.ARTIFACT_NAME }}
          name: libshout-win-${{ env.CURRENT_TIME }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Check if latest release exists and delete if so
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export RELEASE_TAG="libshout-win-latest" # Replace with your target release tag
          
          # Check if the release exists
          if gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "Release $RELEASE_TAG exists. Deleting..."
            gh release delete --cleanup-tag --yes "$RELEASE_TAG"
            echo "Release $RELEASE_TAG deleted."
          else
            echo "Release $RELEASE_TAG does not exist. No action needed."
          fi

      - name: Upload 'latest' release artifact
        uses: ncipollo/release-action@v1
        with:
          tag: libshout-win-latest
          artifacts: ${{ env.ARTIFACT_NAME }}
          name: libshout-win-latest
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          
