name: Build libshout (x64 + x86) and publish combined release

on:
  push:
    branches: [ libshout-win ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BASE_ARTIFACT_NAME: libshout.zip

jobs:
  build-libshout:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      matrix:
        include:
          - arch: x64
            msystem: UCRT64
            pkg_prefix: mingw-w64-ucrt-x86_64
            gosysroot: /ucrt64
            host_triplet: x86_64-w64-mingw32
          - arch: x86
            msystem: MINGW32
            pkg_prefix: mingw-w64-i686
            gosysroot: /mingw32
            host_triplet: i686-w64-mingw32

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2 and install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: |
            pkg-config
            ${{ matrix.pkg_prefix }}-autotools
            ${{ matrix.pkg_prefix }}-gcc
            ${{ matrix.pkg_prefix }}-toolchain
            ${{ matrix.pkg_prefix }}-libogg
            ${{ matrix.pkg_prefix }}-libvorbis
            ${{ matrix.pkg_prefix }}-libtheora
            ${{ matrix.pkg_prefix }}-openssl
            ${{ matrix.pkg_prefix }}-speex
            ${{ matrix.pkg_prefix }}-libwinpthread
            zip
            git

      - name: Build libshout (matrix; ${{ matrix.arch }})
        run: |
          set -ex
          mkdir -p libshout-build
          git clone --recursive https://gitlab.xiph.org/xiph/icecast-libshout libshout-build
          cd libshout-build
          git submodule update --remote src/common || true
          ./autogen.sh

          # Use the shell's POSIX path ($PWD) so libtool/install get valid paths
          export OUTDIR="$PWD/../out-${{ matrix.arch }}"
          mkdir -p "$OUTDIR"

          # Configure and build for this host triplet
          CFLAGS='-DDISABLE_IPV6' ./configure --prefix="$OUTDIR" --host=${{ matrix.host_triplet }} --enable-shared --enable-static
          make -j$(nproc) || make -j1
          make install

          # Pack the installed tree into a zip named per-arch
          cd "$OUTDIR"
          ZIPNAME="libshout-${{ matrix.arch }}.zip"
          zip -r "../$ZIPNAME" .
          ls -lash "../$ZIPNAME"
          echo "ARTIFACT_FILE=$ZIPNAME" >> $GITHUB_ENV

      - name: Upload artifact (libshout-${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: libshout-${{ matrix.arch }}.zip
          path: ${{ env.ARTIFACT_FILE }}

  publish-release:
    needs: build-libshout
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          # no name -> downloads all artifacts from the workflow run
          path: ./downloads
          merge-multiple: true

      - name: Show downloaded files
        run: |
          ls -lah ./downloads

      - name: Set CURRENT_TIME
        run: echo "CURRENT_TIME=$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_ENV

      - name: Create timestamped release with both zips
        uses: ncipollo/release-action@v1
        with:
          tag: libshout-win-${{ env.CURRENT_TIME }}
          artifacts: |
            downloads/libshout-x64.zip
            downloads/libshout-x86.zip
          name: libshout-win-${{ env.CURRENT_TIME }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create/Update 'libshout-win-latest' release with both zips
        uses: ncipollo/release-action@v1
        with:
          tag: libshout-win-latest
          artifacts: |
            downloads/libshout-x64.zip
            downloads/libshout-x86.zip
          name: libshout-win-latest
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
