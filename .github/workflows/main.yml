name: Build fdk-aac Windows

on:
  push:
    branches:
      - 'win-aac'
  workflow_dispatch:

jobs:
  build-windows-fdk-aac:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            msystem: UCRT64
            pkg_prefix: mingw-w64-ucrt-x86_64
            gosysroot: /ucrt64
            cc: x86_64-w64-mingw32-gcc
            arch_suffix: x64

          - arch: x86
            msystem: MINGW32
            pkg_prefix: mingw-w64-i686
            gosysroot: /mingw32
            cc: i686-w64-mingw32-gcc
            arch_suffix: x86

    env:
      FDK_VERSION: master

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: |
            pkg-config
            ${{ matrix.pkg_prefix }}-autotools
            ${{ matrix.pkg_prefix }}-gcc
            ${{ matrix.pkg_prefix }}-toolchain
            git unzip wget

      - name: Add MSYS2 to PATH
        shell: bash
        run: |
          export PATH="/c/msys64${{ matrix.gosysroot }}/bin:$PATH"
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: Clone fdk-aac
        shell: bash
        run: |
          git clone https://github.com/mstorsjo/fdk-aac.git
          cd fdk-aac
          git checkout $FDK_VERSION

      - name: Build & install fdk-aac
        shell: bash
        run: |
          cd fdk-aac
          autoreconf -fiv
          PREFIX="$PWD/fdk-aac-prefix"
          ./configure --prefix="$PREFIX" --enable-static --enable-shared
          make -j$(nproc)
          make install

      - name: Zip fdk-aac
        shell: bash
        run: |
          cd fdk-aac
          mv fdk-aac-prefix ../fdk-build
          cd ..
          zip -r "fdk-aac-windows-${{ matrix.arch_suffix }}.zip" fdk-build 

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v3
        with:
          name: fdk-aac-windows-${{ matrix.arch_suffix }}
          path: fdk-aac-windows-${{ matrix.arch_suffix }}.zip
          retention-days: 1
